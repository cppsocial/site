name: Check - Assets

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "assets/**/*.css"
      - "assets/**/*.html"
      - ".github/workflows/check-assets.yaml"

permissions:
  contents: read

jobs:
  assets:
    name: Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check formatting
        id: formatting
        run: |
          npm run format:assets
          git diff -- assets/ > formatting.diff
          if [[ -s formatting.diff ]]; then
            cat formatting.diff
            echo "::error::Asset formatting differs. Run: make format-assets"
            exit 1
          fi
      - name: Upload formatting diff
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: formatting-diff-${{ github.event.number }}-assets
          path: formatting.diff
          if-no-files-found: error
          retention-days: 7
