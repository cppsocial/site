  description: "After your remote debugging connection is established, it’s time to solve real-world problems. In this second part, Christoph Sterz demonstrates how to use your remote debugging setup to act as if you were running the code directly on your desktop.\n\nWe dive into a real-world scenario: a ship navigation app that crashes on the target device. You'll see how to catch a segmentation fault, interpret stack traces, and identify common pitfalls like lambda lifetime issues in Qt. We also wrap up with QML profiling, showing you how to pinpoint performance bottlenecks and slow frames directly on the hardware.\n\nThis video covers:\n- Remote GDB Workflow: Using target extended-remote to catch crashes in real-time.\n- Debugging Case Study: Solving a classic lambda reference error that only crashes on hardware.\n- QML Performance: How to profile startup costs and runtime frame rates on the device.\n- Safety Warning: Best practices for enabling QML debugging in secure environments.\n\
