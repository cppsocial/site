- video_id: BHhOozU7_U8
  title: 'const correctly in C++ : : Alex Cohn'
  url: https://www.youtube.com/watch?v=BHhOozU7_U8
  published: 2026-02-24 14:00:26+00:00
  updated: 2026-09-05 13:05:35+00:00
  description: 'Presented at Core C++ 2025 conference, Tel Aviv.


    Language: Hebrew


    Const-correctness is one of the basic features of C++. It can make your interfaces safer, your intent clearer, and your code more maintainable.


    We start with the fundamentals: top- and low-level const on variables and pointers — then explore how const applies to member functions, parameters, and interfaces. Along the way we’ll discuss when (and when not) to reach for const_cast, and show how tools like mutable and std::experimental::propagate_const can improve real-world APIs.


    By the end of this short, beginner-friendly session you will have a clear mental model of “const-correctness” and concrete rules to apply in your own code.

    =====


    Alex Cohn


    A software craftsman, enjoying C++ since 1991 and up to day.

    Today, Alex is a Senior C++ Developer at Priority Software, mostly busy with performance optimization of legacy code when moved to cloud environment.'
