name: Update Metadata

on:
  workflow_call:
    inputs:
      updater:
        description: meta-updater subcommand and PR category
        required: true
        type: string
  workflow_dispatch:
    inputs:
      updater:
        description: meta-updater subcommand and PR category
        required: true
        type: choice
        options:
          - blogs
          - books
          - communities
          - events
          - packages
          - youtube

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    concurrency:
      group: meta-updater-${{ inputs.updater }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tools
        run: python -m pip install -r requirements.txt

      - name: Prepare fresh branch
        id: branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-${{ inputs.updater }}
        run: |
          set -euo pipefail

          gh auth setup-git
          git fetch origin "$BASE_BRANCH"

          if git fetch origin \
            "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" \
            2>/dev/null
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          # Always regenerate from the latest default branch.
          git checkout -B "$UPDATE_BRANCH" "origin/$BASE_BRANCH"

      - name: Run updater
        env:
          UPDATER: ${{ inputs.updater }}
        run: make "$UPDATER"

      - name: Stage output
        id: changes
        run: |
          git add -A -- data/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATER: ${{ inputs.updater }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update $UPDATER"

      - name: Update branch
        if: |
          steps.changes.outputs.changed == 'true' ||
          steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-${{ inputs.updater }}
        run: |
          gh auth setup-git
          git push --force-with-lease origin \
            "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-${{ inputs.updater }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATER: ${{ inputs.updater }}
        run: |
          pr_number="$(gh pr list \
            --state open \
            --head "$UPDATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]
          then
            gh pr edit "$pr_number" \
              --title "[metadata] update $UPDATER" \
              --body "Automated update from \`meta-updater $UPDATER\`."
          else
            gh pr create \
              --head "$UPDATE_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "[metadata] update $UPDATER" \
              --body "Automated update from \`meta-updater $UPDATER\`."
          fi
