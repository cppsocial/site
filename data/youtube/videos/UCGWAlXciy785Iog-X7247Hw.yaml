  description: "https://cppnorth.ca/\n---\n\nLightning Talks - CppNorth 2025\n\nLightning Talks are made for passionate people that prepare a short talk about a topic and share their ideas with a wider audience. \n\nWe encourage newcomers to come forward in a welcoming and supportive environment. \n\nThis year was no different with our host, Pier-Antoine Giguère, that made sure that we had as many new speakers as possible. \n\nThis uncut video features the full, CppNorth 2025 Lightning Talks, including an introduction to the conference for first attendees. Don't miss it!\n---\nSponsored by:\nOptiver: https://optiver.com/\nJetBrains: https://www.jetbrains.com/\n---\n\n00:00 Intro\n13:55 Ed Beroset - Management track or individual contributor?\n20:16 Awab Qureshi - Triple Buffering & Channels\n27:08 Sarthak Sehgal - deducing_this and forward_like in C++23\n33:41 Tony Greenberg - Why do I care about performance?\n38:49 Evan Girardin - Visualizing Implicit Conversions\n45:34 Pier-Antoine Giguère\
