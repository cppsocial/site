  title: 'CLion Type and Call Hierarchies: Understand Your C++ Codebase Faster'
  url: https://www.youtube.com/watch?v=HORlR-C_ZKI
  published: 2026-09-09 13:00:19+00:00
  updated: 2026-09-16 11:27:29+00:00
  description: "Large C++ and Qt codebases are easier to work with when you can quickly answer two essential questions:\nWhat does this class inherit from, and which classes inherit from it?\nWho calls this function, and what does it call in turn?\n\nIn this episode of the CLion series, Jesper Pedersen explores CLion’s built-in Type Hierarchy and Call Hierarchy views, and compares their navigation model with the hierarchy tools familiar to Qt Creator users.\n\nYou will learn how to open the Hierarchy tool window, navigate class inheritance relationships, inspect callers and callees, and trace a function’s path through the codebase. This is especially valuable when you are onboarding to an unfamiliar project, debugging an unexpected execution path, or trying to understand how Qt event handling and model/view code fits together.\n\n00:00 CLion code hierarchies overview \n00:14 Open the Hierarchy tool window \n00:46 Type Hierarchy: base and derived classes \n01:33 Navigate inheritance relationships\
    \ \n02:23 Find function call sites \n03:07 Call Hierarchy: callers and callees \n04:15 Trace calls through the codebase \n05:17 Method Hierarchy: what does it do? \n06:10 Type and Call Hierarchy recap\n\nLinks\n\nLInks\n\nAll the CLion video in this series: https://www.youtube.com/playlist?list=PL6CJYn40gN6i3lJ1pDCQacn8WaIsyhbcf\n\nAbout the host\nJesper Pedersen has been working with Qt and helping tens of thousands of developers grow their skills for almost three decades. As COO and HR Director of KDAB, he combines leadership with a passion for hands-on coding and teaching. Through countless trainings and video tutorials, Jesper shares practical tips and smart solutions that make complex ideas easier to grasp.    Every month our newsletter is featuring technical blogs on Qt, C++ and 3D topics: https://www.kdab.com/development-resources/sign-up-for-our-newsletter/   \n\nAbout KDAB: \nTrusted software excellence across embedded and desktop platforms\nThe KDAB Group is a globally recognized\
    \ provider for software consulting, development and training, specializing in embedded devices and complex cross-platform desktop applications. In addition to being leading experts in Qt, C++ and 3D technologies for over two decades, KDAB provides deep expertise across the stack, including Linux, Rust and modern UI frameworks. https://www.kdab.com/software-services. \nKDAB experts regularly take time out to deliver KDAB’s world class training, in-house or at open enrollment courses around the world. We are the market leaders for training in Qt/QML, Modern C++, Rust and OpenGL. https://training.kdab.com/      With over 100 employees from 20 countries and offices in Sweden, Germany, USA, France and UK, we serve clients around the world. https://www.kdab.com/about/contact/"
