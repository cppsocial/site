name: Report a bug
description: Report issues with the website or bugs in the metadata-updater
title: "Bug: "
labels: ["type: bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page or command and the result you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open or run ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS for site bugs; Python version and command for updater bugs.
