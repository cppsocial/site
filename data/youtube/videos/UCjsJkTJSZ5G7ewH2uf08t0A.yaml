- video_id: zEyJGlW1lR8
  title: Implementing Pipeable sort for C++ Ranges
  url: https://www.youtube.com/watch?v=zEyJGlW1lR8
  published: 2026-07-21 07:59:28+00:00
  updated: 2026-08-26 18:18:49+00:00
  description: "One of the most common frustrations for C++ developers using the standard library’s ranges is the inability to pipe a collection directly into a sort algorithm. While C++20 provides beautiful syntax for filter and transform, sort remains a missing piece in the pipeline - at least until today.\n\nIn this episode of Qt Widgets and more, we take on the challenge. Join us as we walk through the journey of building a robust, pipeable sort implementation from scratch.  \n\nWhat you’ll learn in this deep dive:\n\n- The \"Why\": Understanding the technical constraints and why sort doesn't pipe natively in C++20 ranges.\n- The Implementation: How to overload the pipe operator (|) to create clean, readable, modern syntax for your codebases.\n- Expert Techniques: A deep dive into advanced C++ concepts, including - Argument Dependent Lookup (ADL), template template parameters, and compile-time optimizations using if constexpr.\n- Flexibility: How to support custom containers (like QList\
    \ or std::vector), custom comparators, and projections to make your sort as powerful as std::ranges::sort.  \n\nWhether you are looking to sharpen your C++20/23 skills or you need a battle-tested solution to improve your code readability, this episode covers the \"how-to\" and the \"why\" behind the code.\n\nChapters:\n00:00 Welcome\n00:23 What exactly is it we are missing?\n05:35 How to implement sort then?\n07:40 Adding options to sort\n12:31 Detour Argument Depended Lookup\n15:37 The solution for the ADL problem\n16:30 the final version of sortview\n18:53 Now to the gory details\n\nLinks:\n- Ranges V3: https://ericniebler.github.io/range-v3/\n\n- Taming the filter view: https://youtu.be/c1gfbbE2zts\n\n- Argument Dependent Lookup: https://en.cppreference.com/w/cpp/language/adl.html\n\n- Interview with Nicolai Josuttis : YOUTUBE LINK FOR: https://wiki.kdab.com/spaces/MAR/pages/310511200/Interview+with+Nicolai+Josuttis when that has been released\n\n- template template parameters: https://en.cppreference.com/w/cpp/language/template\\\
    _parameters.html\n\nAll Qt Widgets and more videos:\nhttps://www.youtube.com/playlist?list=PL6CJYn40gN6gf-G-o6syFwGrtq3kItEqI\n\nPlease note that non-English dubs for all KDAB videos are auto-generated. These translations have not been moderated by us and may contain inaccuracies. We appreciate your understanding and apologize for any confusion this may cause.\n\nAbout the host:\nThe video is presented by Jesper Pedersen, who started with Qt back when Qt was widgets only and the version was 1.44, which gives him 21 years of experience with Qt. Since 2000 he has taught almost 100 Qt classes, ranging from Qt Widgets to QML. Heck, Jesper even taught a few classes on QTopia Core — Trolltech's initial attempt at creating a phone stack. Today Jesper holds a fancy business title, but that doesn't prevent him from coding both in his job and in his spare time.\n\nEvery month our newsletter is featuring technical blogs on Qt, C++ and 3D topics: https://www.kdab.com/development-resources/sign-up-for-our-newsletter/\n\
