name: Update Metadata

on:
  workflow_call:
    inputs:
      updater:
        description: meta-updater subcommand and PR category
        required: true
        type: string

      output-path:
        description: File or directory owned by the updater
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    concurrency:
      group: meta-updater-${{ inputs.updater }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          python -m pip install -e ./updater
          python -m pip install git+https://github.com/cppsocial/site-generator.git@master

      - name: Prepare fresh branch
        id: branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/update-${{ inputs.updater }}
        run: |
          set -euo pipefail

          git fetch origin "$BASE_BRANCH"

          if git fetch origin \
            "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" \
            2>/dev/null
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          # Always regenerate from the latest default branch.
          git checkout -B "$UPDATE_BRANCH" "origin/$BASE_BRANCH"

      - name: Run updater
        env:
          UPDATER: ${{ inputs.updater }}
        run: make "$UPDATER"

      - name: Stage output
        id: changes
        env:
          OUTPUT_PATH: ${{ inputs.output-path }}
        run: |
          git add -A -- "$OUTPUT_PATH"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        env:
          UPDATER: ${{ inputs.updater }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git commit -m "ci: update $UPDATER"

      - name: Update branch
        if: |
          steps.changes.outputs.changed == 'true' ||
          steps.branch.outputs.exists == 'true'
        env:
          UPDATE_BRANCH: automation/update-${{ inputs.updater }}
        run: |
          git push --force-with-lease origin \
            "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create PR if needed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-${{ inputs.updater }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATER: ${{ inputs.updater }}
        run: |
          if ! gh pr list \
            --state open \
            --head "$UPDATE_BRANCH" \
            --json number \
            --jq 'length > 0' |
            grep -qx true
          then
            gh pr create \
              --head "$UPDATE_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "ci: update $UPDATER" \
              --body "Automated update from \`meta-updater $UPDATER\`."
          fi