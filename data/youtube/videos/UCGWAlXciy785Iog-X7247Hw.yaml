- video_id: WjmukACGJJo
  title: (Lightning Talk) Braden Ganetsky - Reviving PartStacker in C++
  url: https://www.youtube.com/watch?v=WjmukACGJJo
  published: 2025-11-20 13:01:10+00:00
  updated: 2026-09-11 08:34:08+00:00
  description: 'https://cppnorth.ca/

    ---


    Reviving PartStacker in C++


    PartStacker is a beloved piece of software in a niche online community. It performs 3D bin packing for the purpose of lowering 3D printing costs. PartStacker program had not been updated since 2013, so Braden took up the mantle of maintenance in 2025. It wasn''t an easy journey, including recovering lost features by decompilation, rewriting the application in C++ from scratch, and wrestling with package management. This lightning talk tells the story.

    ---


    Sponsored by:

    Optiver: https://optiver.com/

    JetBrains: https://www.jetbrains.com/

    ---


    Braden Ganetsky


    Braden Ganetsky graduated from the University of Manitoba with a degree in mechanical engineering, fueled by his passion for mechanical puzzles. During his final year of school, when all classes and activities were remote, he discovered C++ and has been hooked ever since. He interned as a C++ developer, which turned into a full time job, completing a successful pivot of his career. Now he spend his nights working on fun projects like parser combinators, and getting involved in the C++ community. Since 2023, Braden sits on the ISO C++ Committee as a representative of Canada.

