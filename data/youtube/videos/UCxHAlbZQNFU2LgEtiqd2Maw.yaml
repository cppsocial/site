  title: From Self Taught to Committee Member’s First Accepted Paper - Waffl3x CppCast 410 / C++Weekly 545
  url: https://www.youtube.com/watch?v=4jx7ZsRh6dc
  published: 2026-08-10 15:29:54+00:00
  updated: 2026-09-11 04:23:44+00:00
  description: 'This month Jason and Mathieu are joined by the self-taught Alex (Waffl3x) to discuss the C++ standards committee, defaulted post-fix operators, and self-taught computer engineering. Alex shares his experience of joining the C++ Committee and his efforts to get more people involved.


    News

    * https://mpusz.github.io/mp-units/latest/blog/2026/07/24/introducing-logarithmic-quantities-and-units/ Mateusz needs help with his logarithmic unit design

    * https://www.reddit.com/r/cpp/comments/1v0ut9j/euro_llvm_2026_all_talks_related_to_c_security/ EuroLLVM security related talks

    * And more security related papers: https://www.reddit.com/r/cpp/comments/1v0hynk/a_set_of_papers_related_to_safety_in_july_mailing/

    * Brno mailing: https://www.open-std.org/jtc1/sc22/wg21/docs/papers/2026/#mailing2026-07




    Discussion links

    * https://wg21.link/P0847R7

    * https://wg21.link/P3899'
