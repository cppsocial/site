- video_id: Ny5K6nQtst4
  title: 'CLion Compare to Clipboard: Review AI Code Changes and Moved Code Safely'
  url: https://www.youtube.com/watch?v=Ny5K6nQtst4
  published: 2026-09-09 10:00:02+00:00
  updated: 2026-09-10 06:58:26+00:00
  description: "When AI-assisted coding moves, refactors, or splits code across methods and files, a normal diff can make it difficult to tell whether anything changed beyond the relocation. Were comments lost? Was a variable renamed correctly? Did the generated code quietly alter behavior?\n\nIn this episode of the CLion series, learn how to use Compare to Clipboard to compare any selected block of code with code copied from another location—whether it has moved within a file, been extracted into a class, lives in a different file, or comes from an older Git revision.\n\nThis is a practical technique for reviewing agent-generated and refactored C++ code more confidently, especially when a conventional diff cannot align the original and moved code clearly.\n\n00:00 Why large code comparisons are difficult\n00:15 Reviewing AI-generated refactoring with diffs\n01:16 Introducing Compare to Clipboard\n01:45 Example: code moved into a class\n02:58 Copy the original code to the clipboard\n03:25\
    \ Compare selected code to the clipboard\n04:14 Browse an older Git revision in CLion\n05:06 Compare current code with historical code\n05:25 Wrap-up\n\nAbout the host\nJesper Pedersen has been working with Qt and helping tens of thousands of developers grow their skills for almost three decades. As COO and HR Director of KDAB, he combines leadership with a passion for hands-on coding and teaching. Through countless trainings and video tutorials, Jesper shares practical tips and smart solutions that make complex ideas easier to grasp.    \nEvery month our newsletter is featuring technical blogs on Qt, C++ and 3D topics: https://www.kdab.com/development-resources/sign-up-for-our-newsletter/    \n\nAbout KDAB:   \nTrusted software excellence across embedded and desktop platforms      \nThe KDAB Group is a globally recognized provider for software consulting, development and training, specializing in embedded devices and complex cross-platform desktop applications. In addition to being\
    \ leading experts in Qt, C++ and 3D technologies for over two decades, KDAB provides deep expertise across the stack, including Linux, Rust and modern UI frameworks. https://www.kdab.com/software-services.      \nKDAB experts regularly take time out to deliver KDAB’s world class training, in-house or at open enrollment courses around the world. We are the market leaders for training in Qt/QML, Modern C++, Rust and OpenGL. https://training.kdab.com/ \nWith over 100 employees from 20 countries and offices in Sweden, Germany, USA, France and UK, we serve clients around the world. https://www.kdab.com/about/contact/"
