name: PR preview
run-name: Preview PR #${{ github.event.issue.number }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/preview'
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.authorize.outputs.pr }}
      head-sha: ${{ steps.authorize.outputs.head-sha }}
    steps:
      - name: Authorize preview and resolve PR
        id: authorize
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const username = context.payload.comment.user.login;
            const access = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            const allowed = new Set(['write', 'maintain', 'admin']);
            if (!allowed.has(access.data.permission)) {
              core.setFailed(`${username} does not have write access to ${owner}/${repo}`);
              return;
            }

            const number = context.payload.issue.number;
            const response = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            core.setOutput('pr', String(number));
            core.setOutput('head-sha', response.data.head.sha);
            core.setOutput('base-sha', response.data.base.sha);

      - name: Check out approved PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.authorize.outputs.head-sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh metadata touched by the PR
        env:
          BASE_SHA: ${{ steps.authorize.outputs.base-sha }}
        run: python scripts/update_preview_metadata.py --base "$BASE_SHA"

      - name: Build site
        run: site-generator build

      - name: Upload preview site
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ steps.authorize.outputs.pr }}-site
          path: build
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    environment:
      name: netlify-preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Download preview site
        uses: actions/download-artifact@v8
        with:
          name: pr-${{ needs.build.outputs.pr }}-site
          path: build

      - name: Deploy PR preview
        id: deploy
        env:
          CI: "true"
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NO_COLOR: "1"
          PR: ${{ needs.build.outputs.pr }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --site cppsocial \
            --dir=build \
            --no-build \
            --alias="pr-$PR" \
            2>&1 | tee netlify-output.txt

          preview_url="https://pr-$PR--cppsocial.netlify.app"
          echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### [PR #$PR preview]($preview_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: |
          {
            echo "<!-- cppsocial:pr-preview -->"
            echo "Preview deployed: [$PREVIEW_URL]($PREVIEW_URL)"
            echo
            echo "<details><summary>Netlify deploy and log links</summary>"
            echo
            sed 's/^/    /' netlify-output.txt
            echo
            echo "</details>"
          } > preview-comment.md

      - name: Create or update preview comment as github-actions[bot]
        uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.build.outputs.pr }}
        with:
          github-token: ${{ env.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- cppsocial:pr-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR);
            if (!Number.isInteger(issue_number)) {
              core.setFailed(`Invalid PR number: ${process.env.PR}`);
              return;
            }
            const body = fs.readFileSync('preview-comment.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            // Bot PR comments are sticky: identify ours by marker and update it.
            const existing = comments.toReversed().find(
              ({ body, user }) =>
                user?.id === 41898282 &&
                user.login === 'github-actions[bot]' &&
                (body?.includes(marker) || body?.startsWith('Preview deployed:')),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
