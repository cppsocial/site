$schema: ../../schemas/blocks/card-group.json
type: card_group
title: Related standards
description: Other standards and specifications referenced by the C++ standard or related to it
search_category: related
cards:
  - type: card
    title: "ISO/IEC 9899:2024 (C23)"
    path: https://www.iso.org/standard/82075.html
    description: The current international standard for the C programming language, published in October 2024
  - type: card
    title: ISO C working group (WG14)
    path: https://www.open-std.org/jtc1/sc22/wg14/
    description: Documents and papers of WG14, the C committee
  - type: card
    title: POSIX.1-2024
    path: https://pubs.opengroup.org/onlinepubs/9799919799/
    description: The Open Group Base Specifications for portable operating-system interfaces and utilities
  - type: card
    title: The Unicode Standard
    path: https://www.unicode.org/versions/latest/
    description: The current Unicode specification, annexes, and character database
  - type: card
    title: IEEE 754-2019
    path: https://standards.ieee.org/ieee/754/6210/
    description: The active IEEE standard for binary and decimal floating-point formats, arithmetic, exceptions, and reproducible numerical results
  - type: card
    title: "ISO 4217"
    path: https://www.iso.org/standard/64758.html
    description: ISO 4217:2015 specifies the structure for a three-letter alphabetic code and an equivalent three-digit numeric code for the representation of currencies.
  - type: card
    title: "ISO/IEC TS 18661-3"
    path: https://www.iso.org/standard/65615.html
    description: ISO/IEC TS 18661-3:2015 extends programming language C to include types with the arithmetic interchange and extended floating-point formats specified in ISO/IEC/IEEE 60559:2011, and to include functions that support the non-arithmetic interchange formats in that standard.
