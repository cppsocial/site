name: Check - Content and Data

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "content/**"
      - "scripts/check_data_scope.py"
      - "scripts/check_content_rules.py"
      - ".github/workflows/check-content-data.yaml"

permissions:
  contents: read

jobs:
  data-scope:
    name: Data Scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Warn about generated data unrelated to changed content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_data_scope.py --base "$BASE_SHA"

  rules:
    name: Content Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate machine-checkable content rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_content_rules.py --base "$BASE_SHA"
