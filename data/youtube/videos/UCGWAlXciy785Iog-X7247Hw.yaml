- video_id: ELYEZQOhS9U
  title: (Lightning Talk) Awab Qureshi - Triple Buffering & Channels
  url: https://www.youtube.com/watch?v=ELYEZQOhS9U
  published: 2025-11-18 13:00:35+00:00
  updated: 2026-04-21 17:10:23+00:00
  description: 'https://cppnorth.ca/

    ---


    Triple Buffering & Channels


    A quick and fast explanation of a real-time producer/consumer problem. How to communicate when your producer must always be able to produce and your consumer must always be able to consume? More importantly, how to do it in a way that isn''t ugly. We first talk about triple buffering: an elegant solution for scenarios where data freshness matters more than completeness, such as game engines, audio processing, and embedded systems. Then we talk about channels: a lovely wrapper around our scary concurrency synchronisation code. Disclaimer: the code presented is heavily simplified.

    ---


    Sponsored by:

    Optiver: https://optiver.com/

    JetBrains: https://www.jetbrains.com/

    ---


    Awab Qureshi


    Hello! I am Awab, a Computer Science student at University of Waterloo, graduating in ''27. I enjoy high-performance, low-level computing (which secretly means I go wherever C++ takes me). Currently, I am interested in computer graphics and multiprocessor programming.

