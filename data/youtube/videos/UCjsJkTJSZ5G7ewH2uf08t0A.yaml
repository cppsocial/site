- video_id: BhJCvV8Z5-I
  title: Turn Any Qt App into a Web App using WebRTC & GStreamer
  url: https://www.youtube.com/watch?v=BhJCvV8Z5-I
  published: 2026-08-11 08:00:25+00:00
  updated: 2026-09-09 22:30:41+00:00
  description: "Adding a secondary screen to your Qt-based product is often expensive and complex. What if you could turn your users' smartphones, tablets, or laptops into an interface for your application instead?\n\nIn this video, Christoph Sterz demonstrates how to extend your existing Qt application with WebRTC streaming, allowing it to be accessed from any device with a modern web browser. This solution functions like a high-performance live stream, but with a critical advantage: full bidirectional interaction.\n\nUsing GStreamer, we handle video capture and encoding directly on the GPU, ensuring efficiency while maintaining low latency. We also utilize a specialized backchannel to send touch, keyboard, and mouse inputs from the browser back to your app, meaning users can operate your software remotely.\n\nThis video covers:\n- High-Performance Streaming: Why we use GStreamer to keep video processing on the GPU. \n- Full Interactivity: How to implement the WebRTC backchannel for remote\
    \ control. \n- Implementation Guide: A walkthrough of the code and the streaming pipeline. \n- Real-World Use Cases: From headless industrial IoT devices to remote maintenance and offsite quality assurance.\n\nChapters: \n0:00 - Introduction \n0:28 - Architecture & GStreamer \n1:21 - WebRTC Streaming \n1:45 - Interactive Backchannel \n2:34 - Main Function Walkthrough \n3:02 - The GStreamer Pipeline \n4:32 - Scenario 1: Headless Devices \n5:28 - Scenario 2: Factory Maintenance \n6:00 - Scenario 3: Offsite Monitoring \n6:30 - Scenario 4: Remote Support \n6:51 - Scenario 5: Multi-Device Grid \n7:27 - Security Considerations \n7:38 - Conclusion\n\nLinks:\n* GitHub code: https://github.com/KDABLabs/kdabtv/tree/master/Qt-Embedded-Cycletime/videoA_multicast\n\nAll \"Embedded with Qt\" videos: https://www.youtube.com/playlist?list=PL6CJYn40gN6iVG059HBoLQZ1CMTyXCGpw \n\nPlease note that non-English dubs for all KDAB videos are auto-generated. These translations have not been moderated by us and\
    \ may contain inaccuracies. We appreciate your understanding and apologize for any confusion this may cause.\n\nAbout the host:\nChristoph Sterz has been developing with C++ for over 15 years, and Qt for the last 10. A contributor to Gammaray, KDAB’s in-depth Qt-Analysis-Tool, Christoph specializes in performance optimization for embedded systems.  \n\nEvery month our newsletter is featuring technical blogs on Qt, C++ and 3D topics: https://www.kdab.com/development-reso...       \n\nAbout KDAB:   \nTrusted software excellence across embedded and desktop platforms\n      \nThe KDAB Group is a globally recognized provider for software consulting, development and training, specializing in embedded devices and complex cross-platform desktop applications. In addition to being leading experts in Qt, C++ and 3D technologies for over two decades, KDAB provides deep expertise across the stack, including Linux, Rust and modern UI frameworks. https://www.kdab.com/software-services.      \n\nKDAB\
    \ experts regularly take time out to deliver KDAB’s world class training, in-house or at open enrollment courses around the world. We are the market leaders for training in Qt/QML, Modern C++, Rust and OpenGL. https://training.kdab.com/      \n\nWith over 100 employees from 20 countries and offices in Sweden, Germany, USA, France and UK, we serve clients around the world. https://www.kdab.com/about/contact/"
