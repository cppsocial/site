  description: "Join Jesper Pedersen and Jan Marker for a hands-on update on the Qt AI Assistant in Qt Creator.\n\nSince their previous discussion in October 2025, the assistant has gained new capabilities designed to make AI-supported development more useful, configurable, and better aligned with real-world Qt projects. \n\nJesper Pedersen and Jan Marker explore the newest AI coding features in Qt Creator:\n- support for many third-party coding agents like Claude Code and GitHub Copilot through the Agent Client Protocol (ACP) extension\n- how GitHub Copilot understands a QML project directly from within Qt Creator\n- Qt Creator controlled by GitHub Copilot through the new Model Context Protocol (MCP) extension\n- GitHub Copilot CLI and the MCP extension\n- a discussion of the integration of IDEs and coding agents\n\nChapters:    \n00:00 Welcome    \n01:02 ACP extension setup   \n03:56 GitHub Copilot in QtCreator   \n05:07 MCP extension setup\n06:45 QtCreator MCP in GitHub Copilot\n08:50\
