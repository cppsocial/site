name: Check - Makefile

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "Makefile"
      - ".github/workflows/check-makefile.yaml"

permissions:
  contents: read

jobs:
  makefile:
    name: Makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mbake
        run: python -m pip install 'mbake>=1.4.0'
      - name: Validate
        run: mbake validate Makefile
      - name: Check formatting
        id: formatting
        run: |
          mbake format Makefile
          git diff -- Makefile > formatting.diff
          if [[ -s formatting.diff ]]; then
            cat formatting.diff
            echo "::error::Makefile formatting differs. Run: mbake format Makefile"
            exit 1
          fi
      - name: Upload formatting diff
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: formatting-diff-${{ github.event.number }}-makefile
          path: formatting.diff
          if-no-files-found: error
          retention-days: 7
