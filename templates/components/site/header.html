<header class="header">
    <div class="header-nav">
        <a class="logo" href="{{ '/'|url }}">
        <img class="logo-mark" src="{{ '/favicon.svg'|url }}" alt=""><span>{{ this.config.common.site.name }}</span></a>
        <button class="menu-toggle"
                type="button"
                aria-label="{{ this.config.common.ui.site.menu_label }}"
                aria-controls="primary-menu"
                aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <nav class="menu"
             id="primary-menu"
             aria-label="{{ this.config.common.ui.site.primary_navigation_label }}">
            {% set current_path = this._path|default('/') %}
            <ul>{% for item in main_menu %}<li {% if current_path == item.path or current_path == item.path.rstrip('/') %} class="active"{% endif %}><a href="{{ item.path|url }}">{{ item.label }}</a></li>{% endfor %}</ul>
        </nav>
        <button id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="{{ this.config.common.ui.site.theme_toggle_label }}">
            <svg class="theme-toggle__sun"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="theme-toggle__moon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 aria-hidden="true">
                <path d="M20.5 15.5A8 8 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.5 15.5Z" />
            </svg>
        </button>
    </div>
</header>
