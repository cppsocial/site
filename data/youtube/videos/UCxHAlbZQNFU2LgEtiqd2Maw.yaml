  description: 'Mathieu and Jason are joined by Kevin Carpenter to discuss all aspects of being involved with a conference: from regular attendee, to volunteering, to speaker, volunteer coordinator, and catering concerns. Kevin also shares some of his insights into how credit card processing works, along with some of the challenges he’s encountered. In this episode Jason also gives the guest some homework assignments for future conferences!


