name: Check - Discord

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "content/communities/im.yaml"
      - "scripts/check_discord_invites.py"
      - ".github/workflows/check-discord.yaml"

permissions:
  contents: read

jobs:
  invites:
    name: Discord Invites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate changed Discord invites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/check_discord_invites.py
          --base "$BASE_SHA"
          --path content/communities/im.yaml
