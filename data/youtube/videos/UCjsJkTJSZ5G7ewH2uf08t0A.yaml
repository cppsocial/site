- video_id: kBgI9-1-M1Y
  title: 'Inter-process Communication with Qt: Qt Remote Objects Explained'
  url: https://www.youtube.com/watch?v=kBgI9-1-M1Y
  published: 2026-09-16 06:00:20+00:00
  updated: 2026-09-16 15:58:19+00:00
  description: "Continuing the \"Inter-process Communication with Qt\" series, where we explore how to bridge the gap between software and hardware using Qt's powerful communication modules.  \n\nDo you need to share objects between processes or even across different devices? Qt Remote Objects (QtRO) is a powerful, protocol-agnostic module that makes inter-process communication (IPC) look and feel like standard Qt development.  \n\nIn this deep dive, Christoph Schleifenbaum explores how to bridge systems using a smart home air conditioner example. \n\nYou will learn:\n\n* The core architecture of QtRO (Source vs. Replica).\n* How to define interfaces using `**.rep**` files and the replica compiler (`**repc**`).\n* Building a server application to host objects and a client application (using both C++ Widgets and QML) to interact with them remotely.\n* Handling synchronization and state changes across the network.\n\n0:00 Intro \n0:31 What is QtRemoteObjects \n1:06 Use Cases \n2:38 Key Features\
    \ \n3:34 Example Introduction \n5:10 Example server \n8:56 Example widgets application \n12:06 Example QML application \n14:23 Conclusion \n15:57 Outro\n\nLinks\n\nQtRemoteObjects documentation: https://doc.qt.io/qt-6/qtremoteobjects-index.html   \nCMake qt_add_repc_replicas documentation: https://doc.qt.io/qt-6/qtremoteobjects-cmake-qt-add-repc-replicas.html   \nCMake qt_add_repc_sources documentation: https://doc.qt.io/qt-6/qtremoteobjects-cmake-qt-add-repc-sources.html   \nYou can find the code for this video here: https://github.com/KDABLabs/kdabtv/tree/master/InterProcessCommunication/QtRemoteObjects   \nAll inter-process communication videos: https://www.youtube.com/playlist?list=PL6CJYn40gN6jlyNTFcXhmOEht-CI7XZht    \n\nAbout the host\n\nThis video is presented by Christoph Schleifenbaum, a Senior Software Engineer at KDAB with nearly 20 years of professional experience in Qt. While Christoph primarily focuses on desktop applications, he also has hands-on experience with backend\
    \ development. The video was created with the support of his colleague Bogdan Vatra, who has been working on Qt development at KDAB for more than 10 years.    \n\nPlease note that non-English dubs for all KDAB videos are auto-generated. These translations have not been moderated by us and may contain inaccuracies. We appreciate your understanding and apologize for any confusion this may cause.    Every month our newsletter is featuring technical blogs on Qt, C++ and 3D topics: https://www.kdab.com/development-resources/sign-up-for-our-newsletter/   \n\nAbout KDAB:    \nTrusted software excellence across embedded and desktop platforms    \n\nThe KDAB Group is a globally recognized provider for software consulting, development and training, specializing in embedded devices and complex cross-platform desktop applications. In addition to being leading experts in Qt, C++ and 3D technologies for over two decades, KDAB provides deep expertise across the stack, including Linux, Rust and modern\
    \ UI frameworks. https://www.kdab.com/software-services.    \n\nKDAB experts regularly take time out to deliver KDAB’s world class training, in-house or at open enrollment courses around the world. We are the market leaders for training in Qt/QML, Modern C++, Rust and OpenGL. https://training.kdab.com/    \n\nWith 100+ employees from 20 countries and offices in Sweden, Germany, USA, France and UK, we serve clients around the world. https://www.kdab.com/about/contact/"
