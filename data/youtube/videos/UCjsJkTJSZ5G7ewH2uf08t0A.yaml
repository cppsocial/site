  description: "\"Works on my machine\" is a luxury you rarely have in embedded development. To fix bugs effectively on your target hardware, you first need the right infrastructure. In this video, Christoph Sterz explains the essential setup required for professional-grade embedded debugging.\n\nWe start by demystifying debug symbols: where they are hidden in your SDK, how to manage \"split debug\" files in Yocto, and how to use elfutils to handle your binaries. Finally, we walk through the setup for remote debugging using gdbserver, allowing you to keep your heavy symbol files on your laptop while controlling the application running on your device.\n\nIn this video, we cover:\n- Why debug symbols are non-negotiable and how to find them in your SDK.\n- Managing \"stripped\" vs. \"unstripped\" binaries using file, eu-strip, and eu-unstrip.\n- Strategies for limited storage: Partial debugging vs. remote debugging.\n- Configuring gdbserver and gdb for a seamless remote connection.\n\nChapters:\
