  description: "This is the next part of the \"Inter-process Communication with Qt\" series. In this series, we explore how to bridge the gap between software and hardware using Qt's powerful communication modules.\n\nController Area Network (CAN) bus is the standard for reliable communication in vehicles and industrial environments. In this tutorial, Christoph Schleifenbaum demonstrates how to leverage the Qt Serial Bus module to interact with an EV high-voltage charger.\n\nLearn how to:\n- Configure the CAN bus backend in Qt.\n- Create and manage CAN message frames.\n- Use signals and slots to handle incoming data from the bus.\n- Calculate and send control parameters (Voltage/Current) to external devices.\n\n\n00:00 Intro \n00:45 What is CAN Bus? \n02:12 Charger Communication Protocol \n04:00 QCanBusDevice Setup \n05:24 Receiving CAN Frames \n06:30 Sending CAN Frames \n08:09 Conclusion\n\n\nYou can find the code for this video here: https://github.com/KDABLabs/kdabtv/tree/master/InterProcessCommunication/CANbus\
    \ \n\nAll inter-process communication videos: https://www.youtube.com/playlist?list=PL6CJYn40gN6jlyNTFcXhmOEht-CI7XZht    \n\nAbout the host: \n\nThis video is presented by Christoph Schleifenbaum, a Senior Software Engineer at KDAB, with nearly 20 years of professional experience working with Qt. While his primary focus has been desktop applications, he also has some experience with embedded devices.    \n\nPlease note that non-English dubs for all KDAB videos are auto-generated. These translations have not been moderated by us and may contain inaccuracies. We appreciate your understanding and apologize for any confusion this may cause.    \n\nEvery month our newsletter is featuring technical blogs on Qt, C++ and 3D topics: https://www.kdab.com/development-resources/sign-up-for-our-newsletter/    \n\nAbout KDAB:    \n\nTrusted software excellence across embedded and desktop platforms    \n\nThe KDAB Group is a globally recognized provider for software consulting, development and training,\
