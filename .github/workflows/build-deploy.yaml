name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      upload-pages-artifact: true
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
  mirror:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger mirror deployment
        env:
          GH_IO_MIRROR: ${{ secrets.GH_IO_MIRROR }}
        run: |
          curl --fail-with-body --request POST \
            --url "$GITHUB_API_URL/repos/cppsocial/cppsocial.github.io/actions/workflows/mirror.yaml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_IO_MIRROR" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"ref\":\"main\",\"inputs\":{\"source_run_id\":\"$GITHUB_RUN_ID\"}}"
