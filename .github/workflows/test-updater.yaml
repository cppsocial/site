name: Test - Updater

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - "updater/src/**"
      - "updater/tests/**"
      - "updater/pyproject.toml"
      - "schemas/**"
      - "site_plugins/**"
      - "requirements.txt"
      - ".github/workflows/test-updater.yaml"

permissions:
  contents: read

jobs:
  tests:
    name: Updater
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt 'coverage>=7.6.0'
      - name: Run updater tests with coverage
        env:
          PYTHONPATH: updater/src
        run: |
          python -m coverage run --source=updater/src,schemas,site_plugins \
            -m unittest discover -s updater/tests -v
          python -m coverage report
          python -m coverage json -o coverage-summary.json
          python -m coverage html -d coverage-html
      - name: Upload coverage summary
        if: always() && hashFiles('coverage-summary.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-${{ github.event.number }}-updater
          path: coverage-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload coverage report
        if: always() && hashFiles('coverage-html/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.event.number }}-updater
          path: coverage-html/
          if-no-files-found: error
          retention-days: 7
