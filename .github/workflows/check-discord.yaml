name: Check - Discord

on:
  pull_request:
    branches: [master]
    paths:
      - "content/communities/im.yaml"

permissions:
  contents: read

jobs:
  invites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate changed Discord invites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/check_discord_invites.py
          --base "$BASE_SHA"
          --path content/communities/im.yaml
