name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: site-generator build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  mirror:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger mirror deployment
        env:
          GH_IO_MIRROR: ${{ secrets.GH_IO_MIRROR }}
        run: |
          curl --fail-with-body --request POST \
            --url "$GITHUB_API_URL/repos/cppsocial/cppsocial.github.io/actions/workflows/mirror.yaml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_IO_MIRROR" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --data "{\"ref\":\"main\",\"inputs\":{\"source_run_id\":\"$GITHUB_RUN_ID\"}}"
