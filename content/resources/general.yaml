$schema: ../../schemas/blocks/card-group.json
type: card_group
id: general
title: General resources
description: References, analysis tools, playgrounds, and other practical C++ utilities
cards:
  - title: Compiler Explorer
    path: https://godbolt.org/
    description: Compile and inspect C++ across compilers, versions, architectures, and optimization levels
  - title: Decompiler Explorer
    path: https://dogbolt.org/
    description: An interactive online decompiler which shows equivalent C-like output of decompiled programs from many popular decompilers
  - title: cppreference.com
    path: https://cppreference.com/
    icon: https://raw.githubusercontent.com/isocpp/logos/master/cpp_logo.svg
    description: Detailed language and standard-library reference with compiler-support tables
  - title: cppstat.dev
    path: https://cppstat.dev
    description: A list of C and C++ features and their respective support by compilers and standard library implementations
