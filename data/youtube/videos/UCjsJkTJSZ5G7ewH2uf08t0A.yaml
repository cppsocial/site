  description: "The Mastering Modbus Communication series follows on from the 10-part series Introducing Inter-process Communication, presented by David Faure. In it we explore how to bridge the gap between software and hardware using Qt's powerful communication modules.\n\nIn this first video in the series, Christoph Schleifenbaum shows you how to use the Qt Serial Bus module to communicate with devices using the Modbus protocol. Whether you are working in industrial automation or home energy management, understanding how to read and write to device registers is a fundamental skill.\n\nWe walk through a real-world example using an EV charger, covering:\n- An introduction to the Modbus protocol (TCP/IP and Serial).\n- Setting up the QModbusClient to connect to hardware.\n- How to structure your code to read holding registers and send write requests.\n- A brief look at implementing a Modbus server to simulate device behavior.\n\nChapters:\n00:00 Intro   \n03:38 QModbusClient   \n11:45 QModbusServer\
    \   \n13:37 Conclusion    \n\nLinks:\n\nYou can find the code for this video here: https://github.com/KDABLabs/kdabtv/tree/master/InterProcessCommunication/Modbus\n\nAll \"Inter-Process Communication with Qt\" videos: https://www.youtube.com/playlist?list=PL6CJYn40gN6jlyNTFcXhmOEht-CI7XZht\n\nAll \"Inter-Process Communication with Qt: Mastering Modbus Communication\" videos: https://www.youtube.com/playlist?list=PLaFjYPJU6yFo\n\nAbout the host: \nThis video is presented by Christoph Schleifenbaum, a Senior Software Engineer at KDAB, with nearly 20 years of professional experience working with Qt. While his primary focus has been desktop applications, he also has some experience with embedded devices.    \n\nPlease note that non-English dubs for all KDAB videos are auto-generated. These translations have not been moderated by us and may contain inaccuracies. We appreciate your understanding and apologize for any confusion this may cause.    \n\nEvery month our newsletter is featuring\
