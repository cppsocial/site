- video_id: _SamxM6tnQU
  title: '(Lightning Talk) Tom Tesch - Teaching the NES: Using 6502 Assembly to Teach Modern C++'
  url: https://www.youtube.com/watch?v=_SamxM6tnQU
  published: 2025-11-26 13:01:12+00:00
  updated: 2026-04-22 17:40:06+00:00
  description: "https://cppnorth.ca/\n---\n\nTeaching the NES: Using 6502 Assembly to Teach Modern C++\n\nThis lightning talk explores how teaching students to develop NES games in 6502 assembly helps them build a deeper understanding of modern C++ concepts like memory management, zero-cost abstractions, and systems-level thinking. By stripping away modern conveniences, the NES makes the hardware visible, revealing what C++ is really doing under the hood. \n---\n\nSponsored by:\nOptiver: https://optiver.com/\nJetBrains: https://www.jetbrains.com/\n---\n\nTom Tesch\n\nTom is currently a senior lecturer for the Bachelor in Digital Arts and Entertainment at Howest University of Applied Sciences, where he is on a mission to inspire the next generation of game developers. His expertise revolves around teaching C++, algorithms, and the core principles of computer science to aspiring game creators. Tom's journey into the world of technology began with obtaining a Master's degree in Applied Science\
    \ focused on Electronics Engineering. Armed with this knowledge, he embarked on his professional career as an ASIC design engineer, immersing himself in the intricate process of crafting custom digital integrated circuits. Transitioning into the realm of embedded systems, Tom played a key role in the development of cutting-edge solutions that seamlessly bridged the gap between hardware and software. During this time, he employed his technical prowess in the domain of scientific research, where he developed interactive models for socio-economic analysis, showcasing his versatility and interdisciplinary skills. With an additional Master's degree in Industrial Management under his belt, Tom's expertise has expanded to encompass strategic project management, offering him a holistic understanding of engineering endeavors, while keeping him grounded in the day-to-day realities of software development within various industries. Today, as a lecturer at Howest–DAE–Game Development, he combines\
    \ his broad experience with his love for retro gaming, not only guiding aspiring developers through the intricacies of coding but also immersing them in the timeless charm of vintage gaming.\n---\n\nCppNorth is an annual C++ conference held in Toronto, Canada.\n- Annual CppNorth C++ conference: https://cppnorth.ca/\n- CppNorth Bluesky: https://bsky.app/profile/cppnorth.bsky.social\n\n---\n\nYouTube Videos Edited by\nReid McInroy\nreid.mcinroy@gmail.com\n\n#cpp #cppnorth #programming  #nes  #6502assembly #modern C++ #teachingC++ #retroprogramming #emulator #cppnorth  #gamedevelopment #lowlevelprogramming #Howest #DigitalArtsandEntertainment #TomTesch #learningC++ #retroconsole #C++education #C++pedagogy #systemsprogramming #hardwareawareprogramming"
